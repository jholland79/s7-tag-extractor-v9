# yamllint configuration
# See: https://yamllint.readthedocs.io/

extends: default

rules:
  # Allow long lines (common in CI configs)
  line-length:
    max: 120
    allow-non-breakable-words: true
    allow-non-breakable-inline-mappings: true

  # Require consistent indentation
  indentation:
    spaces: 2
    indent-sequences: true

  # Allow truthy values like 'on' in GitHub Actions
  truthy:
    allowed-values: ['true', 'false', 'yes', 'no', 'on', 'off']

  # Don't require document start markers
  document-start: disable

  # Allow comments without space (for commented-out code)
  comments:
    require-starting-space: false
    min-spaces-from-content: 1

  # Allow empty values
  empty-values:
    forbid-in-block-mappings: false
    forbid-in-flow-mappings: false
